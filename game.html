<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Boardgames</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header#game-header {
      flex: none;
      color: #fff;
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f1f;
    }
    header .session-info {
      font-size: 14px;
      color: #ccc;
    }
    header .game-title {
      font-size: 16px;
    }
    /* Les actions du bandeau sont des boutons et non des liens : elles ne
       mènent nulle part, elles agissent sur la page. */
    button.back {
      font: inherit;
      font-size: 14px;
      color: #ffd700;
      background: transparent;
      /* la bordure prend la couleur du texte : un bouton rouge le reste sans
         avoir à répéter la règle */
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button.back:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    button.back:disabled {
      opacity: 0.5;
      cursor: progress;
    }
    .back-links {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    /* la clôture est définitive : elle vide le code de la partie */
    button.back.danger {
      color: #ff8a80;
    }
    #game-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px;
      box-sizing: border-box;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 2px solid #444;
      box-sizing: border-box;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header id="game-header">
    <span class="game-title" id="game-title">Online Boardgames</span>
    <span class="session-info" id="session-info"></span>
    <span class="back-links">
      <!-- visible pour l'owner seul, tant que la partie n'a pas commencé -->
      <button type="button" class="back" id="start-link" hidden>Démarrer la session</button>
      <button type="button" class="back" id="screenshot-link">Copie d'écran</button>
      <button type="button" class="back" id="back-link">&larr; Quitter et reprendre plus tard</button>
      <!-- visible pour l'owner seul : le serveur le décide, pas cette page -->
      <button type="button" class="back danger" id="close-link" hidden>Clore la partie et quitter</button>
    </span>
  </header>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script type="module" src="/src/game.ts"></script>
</body>
</html>
