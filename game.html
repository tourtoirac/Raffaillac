<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Boardgames</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header#game-header {
      flex: none;
      color: #fff;
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f1f;
    }
    header .session-info {
      font-size: 14px;
      color: #ccc;
    }
    header .game-title {
      font-size: 16px;
    }
    a.back {
      color: #ffd700;
      text-decoration: none;
    }
    .back-links {
      display: flex;
      gap: 16px;
      align-items: baseline;
    }
    /* la clôture est définitive : elle vide le code de la partie */
    a.back.danger {
      color: #ff8a80;
    }
    #game-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px;
      box-sizing: border-box;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 2px solid #444;
      box-sizing: border-box;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header id="game-header">
    <span class="game-title" id="game-title">Online Boardgames</span>
    <span class="session-info" id="session-info"></span>
    <span class="back-links">
      <a class="back" id="back-link" href="index.html">&larr; Quitter et reprendre plus tard</a>
      <!-- visible pour l'owner seul : le serveur le décide, pas cette page -->
      <a class="back danger" id="close-link" href="index.html" hidden>Clore la partie et quitter</a>
    </span>
  </header>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script type="module" src="/src/game.ts"></script>
</body>
</html>
