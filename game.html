<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Boardgames</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header#game-header {
      flex: none;
      color: #fff;
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f1f;
    }
    header .session-info {
      font-size: 14px;
      color: #ccc;
    }
    header .game-title {
      font-size: 16px;
    }
    /* Les actions du bandeau sont des boutons et non des liens : elles ne
       mènent nulle part, elles agissent sur la page. */
    button.back {
      font: inherit;
      font-size: 14px;
      color: #ffd700;
      background: transparent;
      /* la bordure prend la couleur du texte : un bouton rouge le reste sans
         avoir à répéter la règle */
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button.back:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    button.back:disabled {
      opacity: 0.5;
      cursor: progress;
    }
    .back-links {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    /* la clôture est définitive : elle vide le code de la partie */
    button.back.danger {
      color: #ff8a80;
    }
    /* Optional second bar, under the save and close bar: the game decides
       which of its buttons show (options.fix_positions, options.screen_capture). */
    #options-bar {
      flex: none;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 6px 20px;
      box-sizing: border-box;
      background: #262626;
      border-top: 1px solid #3a3a3a;
    }
    #options-bar[hidden] {
      display: none;
    }
    /* The documents of the game, at the top of the participants panel,
       above the voice channel. */
    #documents-select {
      flex: none;
      width: 100%;
      font: inherit;
      font-size: 14px;
      color: #ffd700;
      background: #262626;
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #documents-select[hidden] {
      display: none;
    }
    #game-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px;
      box-sizing: border-box;
      position: relative;
    }
    /* Covers the table, not the header: leaving the game stays possible
       while the images load. */
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #2b2b2b;
      color: #fff;
      font-size: 18px;
      text-align: center;
      white-space: pre-line;
      padding: 0 20px;
      box-sizing: border-box;
    }
    #loading-overlay[hidden] {
      display: none;
    }
    /* Inactivity popups: above everything, the page can only answer them. */
    .idle-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }
    .idle-overlay[hidden] {
      display: none;
    }
    .idle-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      padding: 20px 28px;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font-size: 17px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
    .idle-box p {
      margin: 0;
    }
    .idle-box button {
      min-width: 120px;
      padding: 6px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    #loading-bar {
      width: min(420px, 70%);
      height: 10px;
      accent-color: #ffd700;
    }
    #loading-warning {
      font-size: 14px;
      color: #ff8a80;
      min-height: 1em;
    }
    /* Everybody attached to the game, on the right of the table: the reader
       first, then the players and the watchers. */
    /* A fixed width: the list scrolls on its own, the chat stays at the
       bottom of the column. */
    #participants {
      flex: none;
      width: 300px;
      margin-left: 12px;
      padding: 8px 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      background: #262626;
      border: 2px solid #444;
      border-radius: 4px;
      font-size: 14px;
    }
    #participants[hidden] {
      display: none;
    }
    #participants ul {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #participants li {
      display: flex;
      align-items: center;
      padding: 3px 0;
      white-space: nowrap;
    }
    /* a nickname too long for the column is cut, the whole of it in the title */
    #participants .participant-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #participants .voice-dot,
    #participants .hand-icon,
    #participants .player-icon,
    #participants .hand-count {
      flex: none;
    }
    #participants li.self {
      font-weight: bold;
    }
    /* the owner drags the name of a player to another place of the list */
    #participants li.sortable {
      cursor: grab;
    }
    #participants li.drop-before {
      box-shadow: 0 -2px 0 #6fcf6f;
    }
    #participants li.drop-after {
      box-shadow: 0 2px 0 #6fcf6f;
    }
    /* the voice channel, at the top of the participants panel */
    #voice-controls {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid #3a3a3a;
    }
    #voice-controls[hidden] {
      display: none;
    }
    #voice-controls button {
      padding: 4px 6px;
      background: #3a3a3a;
      border: 1px solid #666;
      border-radius: 4px;
      color: #eee;
      font-size: 12px;
      cursor: pointer;
    }
    #voice-controls button[hidden] {
      display: none;
    }
    #voice-controls button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #voice-join-button.active {
      border-color: #6fcf6f;
    }
    #voice-mute-button.muted {
      background: #5a2d2d;
      border-color: #ff8a80;
    }
    /* a player in the voice channel; lit while it speaks */
    #participants .voice-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 5px;
      border-radius: 50%;
      background: #666;
      vertical-align: 1px;
    }
    #participants .voice-dot.speaking {
      background: #6fcf6f;
      box-shadow: 0 0 6px 2px rgba(111, 207, 111, 0.8);
    }
    /* the private hand of a player, before its name (Common/resources) */
    #participants .hand-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 5px;
      vertical-align: -3px;
    }
    #participants .hand-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* the eye next to another player: follows its view while lit */
    #participants .follow-eye {
      flex: none;
      display: inline-flex;
      width: 22px;
      height: 18px;
      margin-left: 6px;
      padding: 1px 2px;
      background: none;
      border: 1px solid transparent;
      border-radius: 3px;
      color: #888;
      cursor: pointer;
    }
    #participants .follow-eye:hover {
      color: #eee;
    }
    /* that player follows the reader: it cannot be followed back */
    #participants .follow-eye:disabled {
      color: #555;
      cursor: not-allowed;
    }
    #participants .follow-eye.active {
      color: #6fcf6f;
      border-color: #6fcf6f;
    }
    #participants .follow-eye svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* the image the game gives a player (player_icons), before its name */
    #participants .player-icon {
      width: 18px;
      height: 18px;
      margin-right: 5px;
      object-fit: contain;
    }
    /* a carried token released on this name joins that hand */
    #participants li.hand-receiver.drop-target {
      background: #33402f;
      outline: 1px solid #6fcf6f;
      border-radius: 3px;
    }
    /* how many tokens that player keeps in its private hand */
    #participants .hand-count {
      margin-left: 6px;
      padding: 0 6px;
      border: 1px solid currentColor;
      border-radius: 9px;
      font-size: 12px;
      font-weight: normal;
    }
    /* The backs of the tokens another player keeps in hand, shown while the
       pointer is on its name. Placed by the page, on the left of the list. */
    #hand-preview {
      position: fixed;
      z-index: 10;
      max-width: 420px;
      padding: 8px 10px;
      box-sizing: border-box;
      background: #1f1f1f;
      border: 1px solid #666;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      color: #ccc;
      font-size: 13px;
      pointer-events: none;
    }
    /* the item of the private hand under the pointer, at the real size of
       its picture, just above the pointer */
    #hand-zoom {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }

    #hand-zoom[hidden] {
      display: none;
    }

    #hand-preview[hidden] {
      display: none;
    }
    #hand-preview .hand-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    /* The private hand of the reader, across the bottom of the page. */
    #private-hand {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 104px;
      padding: 6px 20px;
      box-sizing: border-box;
      background: #262626;
      border-top: 1px solid #3a3a3a;
      color: #ccc;
      font-size: 14px;
    }
    #private-hand[hidden] {
      display: none;
    }
    /* a token held by the mouse is over the hand: releasing it keeps it there */
    #private-hand.drop-target {
      background: #33402f;
      border-top-color: #6fcf6f;
    }
    #private-hand .hand-label {
      flex: none;
    }
    /* icon from Common/resources, set by game.ts */
    #flip-hand-button {
      flex: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      background: #2f2f2f center / 36px 36px no-repeat;
      cursor: pointer;
    }
    #flip-hand-button:hover:not(:disabled) {
      background-color: #3d3d3d;
      border-color: #6f6f6f;
    }
    #flip-hand-button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #private-hand .hand-items,
    #private-hand-items {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    .hand-item {
      flex: none;
      height: 80px;
      border-radius: 3px;
      user-select: none;
    }
    #private-hand .hand-item {
      cursor: grab;
    }
    #show-hands-select {
      flex: none;
      padding: 6px 10px;
      background: #3a3a3a;
      border: 1px solid #666;
      border-radius: 4px;
      color: #eee;
      font-size: 14px;
      cursor: pointer;
    }
    #show-hands-select[hidden] {
      display: none;
    }
    /* The cards the players show of their hand: over the bottom of the
       table, right above the private hand they are dragged from. */
    #show-zones {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #show-zones:empty {
      display: none;
    }
    .show-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 104px;
      padding: 6px 14px;
      box-sizing: border-box;
      background: rgba(38, 38, 38, 0.94);
      border: 1px solid #6f9fcf;
      border-radius: 6px;
      color: #ccc;
      font-size: 14px;
    }
    .show-zone .show-label {
      flex: none;
    }
    .show-zone .hand-items {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    /* the owner grabs a card of its area to play it or to hide it again */
    .show-zone .hand-item.grabbable {
      cursor: grab;
    }
    /* a shown card and its rank, read the same by the owner and its readers */
    .show-zone .show-card {
      position: relative;
      flex: none;
      display: flex;
    }
    .show-zone .show-rank {
      position: absolute;
      top: 3px;
      left: 3px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      box-sizing: border-box;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #ddd;
      color: #fff;
      font: bold 12px/18px sans-serif;
      text-align: center;
      pointer-events: none;
    }
    .show-zone .show-hint {
      color: #888;
      font-style: italic;
    }
    .show-zone button {
      flex: none;
      padding: 6px 10px;
      background: #3a3a3a;
      border: 1px solid #666;
      border-radius: 4px;
      color: #eee;
      cursor: pointer;
    }
    /* a token whose back the others may not see: a plain card of its shape */
    div.hand-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #444;
      border: 1px solid #777;
      box-sizing: border-box;
      color: #aaa;
      font-size: 20px;
    }
    #participants li.player {
      color: #6fcf6f;
    }
    #participants li.player.absent {
      color: #ff8a80;
    }
    #participants li.watcher {
      color: #6fb3ff;
    }
    /* The text chat (src/chat.ts), at the bottom of the participants column. */
    #chat-panel {
      flex: none;
      height: 280px;
      display: flex;
      flex-direction: column;
      background: #1f1f1f;
      border: 1px solid #444;
      border-radius: 4px;
      box-sizing: border-box;
      color: #ddd;
      font-size: 13px;
    }
    #chat-panel[hidden] {
      display: none;
    }
    #chat-panel.collapsed {
      height: auto;
    }
    #chat-panel.collapsed .chat-log,
    #chat-panel.collapsed .chat-form {
      display: none;
    }
    .chat-header {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      padding: 4px;
      border-bottom: 1px solid #3a3a3a;
    }
    .chat-tabs {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-width: 0;
    }
    .chat-tab,
    .chat-toggle {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 8px;
      background: #3a3a3a;
      border: 1px solid #666;
      border-radius: 4px;
      color: #eee;
      font-size: 12px;
      cursor: pointer;
    }
    .chat-tab.active {
      border-color: #ffd700;
      color: #ffd700;
    }
    .chat-toggle {
      flex: none;
    }
    .chat-toggle.unread {
      border-color: #6fcf6f;
      color: #6fcf6f;
    }
    /* how many messages of that channel the reader has not seen */
    .chat-unread {
      margin-left: 5px;
      padding: 0 5px;
      border-radius: 8px;
      background: #6fcf6f;
      color: #1e1e1e;
      font-weight: bold;
    }
    .chat-log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 6px;
    }
    .chat-line {
      padding: 1px 0;
      overflow-wrap: anywhere;
    }
    .chat-time {
      color: #888;
      margin-right: 5px;
      font-size: 11px;
    }
    /* a long nickname is cut: the whole of it in the title */
    .chat-author {
      display: inline-block;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
      color: #6fb3ff;
      font-weight: bold;
      margin-right: 5px;
    }
    .chat-line.mine .chat-author {
      color: #6fcf6f;
    }
    .chat-form {
      display: flex;
      border-top: 1px solid #3a3a3a;
    }
    .chat-input {
      flex: 1;
      min-width: 0;
      padding: 5px 6px;
      background: #1e1e1e;
      border: none;
      color: #eee;
      font: inherit;
    }
    .chat-input:focus {
      outline: 1px solid #ffd700;
    }
    #gameCanvas {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: block;
      border: 2px solid #444;
      box-sizing: border-box;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header id="game-header">
    <span class="game-title" id="game-title">Online Boardgames</span>
    <span class="session-info" id="session-info"></span>
    <span class="back-links">
      <!-- visible pour l'owner seul, tant que la partie n'a pas commencé -->
      <button type="button" class="back" id="start-link" hidden>Démarrer la session</button>
      <button type="button" class="back" id="back-link">&larr; Quitter et reprendre plus tard</button>
      <!-- visible pour l'owner seul : le serveur le décide, pas cette page -->
      <button type="button" class="back danger" id="close-link" hidden>Clore la partie et quitter</button>
    </span>
  </header>

  <!-- each button shows unless the game turns it off in its options; the
       first one is for the players only -->
  <div id="options-bar" hidden>
    <button type="button" class="back" id="fix-link" title="Restaure le cadre vert à la position actuelle des pions" hidden>Fixe la position</button>
    <button type="button" class="back" id="screenshot-link" hidden>Copie d'écran</button>
  </div>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <!-- one area for each player showing cards of its hand to the reader -->
    <div id="show-zones"></div>
    <!-- filled from the participants the server sends at each arrival or departure -->
    <aside id="participants" aria-label="Joueurs et spectateurs" hidden>
      <!-- filled from the "documents" of the game; hidden when it has none -->
      <select id="documents-select" aria-label="Consulter un document" hidden>
        <option value="">Consulter</option>
      </select>
      <!-- players only: the voice channel of the game (src/voice.ts) -->
      <div id="voice-controls" hidden>
        <button id="voice-join-button" type="button">Rejoindre l'audio</button>
        <button id="voice-mute-button" type="button" hidden>Micro ouvert</button>
      </div>
      <ul id="participants-list"></ul>
      <!-- the text chat: a general channel and, for a player, one private
           channel with each other player (src/chat.ts) -->
      <section id="chat-panel" aria-label="Chat" hidden>
        <div class="chat-header">
          <div class="chat-tabs" role="tablist"></div>
          <button class="chat-toggle" type="button">▼</button>
        </div>
        <div class="chat-log" aria-live="polite"></div>
        <form class="chat-form" autocomplete="off">
          <input class="chat-input" type="text" aria-label="Message">
        </form>
      </section>
    </aside>
    <!-- shown until every image is loaded and the initial setup is applied -->
    <div id="loading-overlay" role="status" aria-live="polite">
      <span id="loading-text">Chargement en cours…</span>
      <progress id="loading-bar" max="1" value="0"></progress>
      <span id="loading-warning"></span>
    </div>
  </div>

  <!-- players only: what the reader keeps off the table. A token released
       here joins it, and one dragged from here to the table is played. -->
  <div id="private-hand" hidden>
    <!-- turns over every card of the strip at once -->
    <button id="flip-hand-button" type="button" title="Retourner toutes les cartes"
            aria-label="Retourner toutes les cartes"></button>
    <span class="hand-label">Ma main</span>
    <div id="private-hand-items"></div>
    <!-- only when options.private_hand.show_hands_to_other_players is true -->
    <select id="show-hands-select" aria-label="Show hands to" hidden></select>
  </div>

  <div id="hand-preview" hidden></div>
  <img id="hand-zoom" alt="" hidden>

  <script type="module" src="/src/game.ts"></script>
</body>
</html>
