<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Boardgames</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header#game-header {
      flex: none;
      color: #fff;
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f1f;
    }
    header .session-info {
      font-size: 14px;
      color: #ccc;
    }
    header .game-title {
      font-size: 16px;
    }
    /* Les actions du bandeau sont des boutons et non des liens : elles ne
       mènent nulle part, elles agissent sur la page. */
    button.back {
      font: inherit;
      font-size: 14px;
      color: #ffd700;
      background: transparent;
      /* la bordure prend la couleur du texte : un bouton rouge le reste sans
         avoir à répéter la règle */
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button.back:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    button.back:disabled {
      opacity: 0.5;
      cursor: progress;
    }
    .back-links {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    /* la clôture est définitive : elle vide le code de la partie */
    button.back.danger {
      color: #ff8a80;
    }
    /* Optional second bar, under the save and close bar: the game decides
       which of its buttons show (options.fix_positions, options.screen_capture). */
    #options-bar {
      flex: none;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 6px 20px;
      box-sizing: border-box;
      background: #262626;
      border-top: 1px solid #3a3a3a;
    }
    #options-bar[hidden] {
      display: none;
    }
    /* The documents of the game, on the left of the bar: the auto margin
       pushes the buttons to the right. */
    #documents-select {
      font: inherit;
      font-size: 14px;
      color: #ffd700;
      background: #262626;
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 4px 10px;
      margin-right: auto;
      max-width: 50%;
      cursor: pointer;
    }
    #documents-select[hidden] {
      display: none;
    }
    #game-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px;
      box-sizing: border-box;
      position: relative;
    }
    /* Covers the table, not the header: leaving the game stays possible
       while the images load. */
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #2b2b2b;
      color: #fff;
      font-size: 18px;
      text-align: center;
      white-space: pre-line;
      padding: 0 20px;
      box-sizing: border-box;
    }
    #loading-overlay[hidden] {
      display: none;
    }
    #loading-bar {
      width: min(420px, 70%);
      height: 10px;
      accent-color: #ffd700;
    }
    #loading-warning {
      font-size: 14px;
      color: #ff8a80;
      min-height: 1em;
    }
    /* Everybody attached to the game, on the right of the table: the reader
       first, then the players and the watchers. */
    #participants {
      flex: none;
      width: 170px;
      margin-left: 12px;
      padding: 8px 10px;
      box-sizing: border-box;
      overflow-y: auto;
      background: #262626;
      border: 2px solid #444;
      border-radius: 4px;
      font-size: 14px;
    }
    #participants[hidden] {
      display: none;
    }
    #participants ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #participants li {
      padding: 3px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #participants li.self {
      font-weight: bold;
    }
    /* the owner drags the name of a player to another place of the list */
    #participants li.sortable {
      cursor: grab;
    }
    #participants li.drop-before {
      box-shadow: 0 -2px 0 #6fcf6f;
    }
    #participants li.drop-after {
      box-shadow: 0 2px 0 #6fcf6f;
    }
    /* how many tokens that player keeps in its private hand */
    #participants .hand-count {
      margin-left: 6px;
      padding: 0 6px;
      border: 1px solid currentColor;
      border-radius: 9px;
      font-size: 12px;
      font-weight: normal;
    }
    /* The backs of the tokens another player keeps in hand, shown while the
       pointer is on its name. Placed by the page, on the left of the list. */
    #hand-preview {
      position: fixed;
      z-index: 10;
      max-width: 420px;
      padding: 8px 10px;
      box-sizing: border-box;
      background: #1f1f1f;
      border: 1px solid #666;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      color: #ccc;
      font-size: 13px;
      pointer-events: none;
    }
    /* the item of the private hand under the pointer, at the real size of
       its picture, just above the pointer */
    #hand-zoom {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    }

    #hand-zoom[hidden] {
      display: none;
    }

    #hand-preview[hidden] {
      display: none;
    }
    #hand-preview .hand-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    /* The private hand of the reader, across the bottom of the page. */
    #private-hand {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 104px;
      padding: 6px 20px;
      box-sizing: border-box;
      background: #262626;
      border-top: 1px solid #3a3a3a;
      color: #ccc;
      font-size: 14px;
    }
    #private-hand[hidden] {
      display: none;
    }
    /* a token held by the mouse is over the hand: releasing it keeps it there */
    #private-hand.drop-target {
      background: #33402f;
      border-top-color: #6fcf6f;
    }
    #private-hand .hand-label {
      flex: none;
    }
    #private-hand .hand-items,
    #private-hand-items {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    .hand-item {
      flex: none;
      height: 80px;
      border-radius: 3px;
      user-select: none;
    }
    #private-hand .hand-item {
      cursor: grab;
    }
    #show-hands-select {
      flex: none;
      padding: 6px 10px;
      background: #3a3a3a;
      border: 1px solid #666;
      border-radius: 4px;
      color: #eee;
      font-size: 14px;
      cursor: pointer;
    }
    #show-hands-select[hidden] {
      display: none;
    }
    /* The cards the players show of their hand: over the bottom of the
       table, right above the private hand they are dragged from. */
    #show-zones {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #show-zones:empty {
      display: none;
    }
    .show-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 104px;
      padding: 6px 14px;
      box-sizing: border-box;
      background: rgba(38, 38, 38, 0.94);
      border: 1px solid #6f9fcf;
      border-radius: 6px;
      color: #ccc;
      font-size: 14px;
    }
    .show-zone .show-label {
      flex: none;
    }
    .show-zone .hand-items {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    .show-zone .show-hint {
      color: #888;
      font-style: italic;
    }
    .show-zone button {
      flex: none;
      padding: 6px 10px;
      background: #3a3a3a;
      border: 1px solid #666;
      border-radius: 4px;
      color: #eee;
      cursor: pointer;
    }
    /* a token whose back the others may not see: a plain card of its shape */
    div.hand-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #444;
      border: 1px solid #777;
      box-sizing: border-box;
      color: #aaa;
      font-size: 20px;
    }
    #participants li.player {
      color: #6fcf6f;
    }
    #participants li.player.absent {
      color: #ff8a80;
    }
    #participants li.watcher {
      color: #6fb3ff;
    }
    #gameCanvas {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: block;
      border: 2px solid #444;
      box-sizing: border-box;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header id="game-header">
    <span class="game-title" id="game-title">Online Boardgames</span>
    <span class="session-info" id="session-info"></span>
    <span class="back-links">
      <!-- visible pour l'owner seul, tant que la partie n'a pas commencé -->
      <button type="button" class="back" id="start-link" hidden>Démarrer la session</button>
      <button type="button" class="back" id="back-link">&larr; Quitter et reprendre plus tard</button>
      <!-- visible pour l'owner seul : le serveur le décide, pas cette page -->
      <button type="button" class="back danger" id="close-link" hidden>Clore la partie et quitter</button>
    </span>
  </header>

  <!-- each button shows unless the game turns it off in its options; the
       first one is for the players only -->
  <div id="options-bar" hidden>
    <!-- filled from the "documents" of the game; hidden when it has none -->
    <select id="documents-select" aria-label="Consulter un document" hidden>
      <option value="">Consulter</option>
    </select>
    <button type="button" class="back" id="fix-link" title="Restaure le cadre vert à la position actuelle des pions" hidden>Fixe la position</button>
    <button type="button" class="back" id="screenshot-link" hidden>Copie d'écran</button>
  </div>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <!-- one area for each player showing cards of its hand to the reader -->
    <div id="show-zones"></div>
    <!-- filled from the participants the server sends at each arrival or departure -->
    <aside id="participants" aria-label="Joueurs et spectateurs" hidden>
      <ul id="participants-list"></ul>
    </aside>
    <!-- shown until every image is loaded and the initial setup is applied -->
    <div id="loading-overlay" role="status" aria-live="polite">
      <span id="loading-text">Chargement en cours…</span>
      <progress id="loading-bar" max="1" value="0"></progress>
      <span id="loading-warning"></span>
    </div>
  </div>

  <!-- players only: what the reader keeps off the table. A token released
       here joins it, and one dragged from here to the table is played. -->
  <div id="private-hand" hidden>
    <span class="hand-label">Ma main</span>
    <div id="private-hand-items"></div>
    <!-- only when options.private_hand.show_hands_to_other_players is true -->
    <select id="show-hands-select" aria-label="Show hands to" hidden></select>
  </div>

  <div id="hand-preview" hidden></div>
  <img id="hand-zoom" alt="" hidden>

  <script type="module" src="/src/game.ts"></script>
</body>
</html>
