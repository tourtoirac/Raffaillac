<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waterloo</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2b2b;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header#game-header {
      flex: none;
      color: #fff;
      padding: 10px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f1f1f;
    }
    header .session-info {
      font-size: 14px;
      color: #ccc;
    }
    a.back {
      color: #ffd700;
      text-decoration: none;
    }
    #game-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px;
      box-sizing: border-box;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 2px solid #444;
      box-sizing: border-box;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header id="game-header">
    <span>Waterloo</span>
    <span class="session-info" id="session-info"></span>
    <a class="back" href="index.html">&larr; Quitter</a>
  </header>

  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script type="py" src="main.py"></script>
</body>
</html>
