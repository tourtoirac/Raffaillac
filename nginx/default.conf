# Raffaillac: the built lobby and game pages, the Games/ resources (mounted
# volume), and the Hautefort service (Air Force) under /hautefort/, so that
# the whole site lives under one URL.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, resolved again at each request: nginx starts and keeps
    # serving the lobby even when the Hautefort container is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hautefort: API, WebSockets and game page, the /hautefort prefix stripped
    location /hautefort/ {
        set $hautefort http://obg-hautefort:8000;
        rewrite ^/hautefort/(.*)$ /$1 break;
        proxy_pass $hautefort;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a game can stay silent for a long time between two turns
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
